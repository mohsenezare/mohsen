name: Probe TGJU global symbol catalog
on:
  push:
    branches: [fix/tgju-source-live-audit]
    paths: [.github/workflows/tgju-catalog-probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Lookup TGJU global FX identifiers
        run: |
          python3 - <<'PY'
          import json, urllib.parse, urllib.request
          requests=[('markets.global','EUR'),('markets.global','USD'),('markets.global','GBP'),('markets.crypto','bitcoin'),('markets.global','Brent')]
          for module,query in requests:
            url='https://api.tgju.org/v1/newsearch?'+urllib.parse.urlencode({'module':module,'page':1,'query':query})
            req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://www.tgju.org/','Accept':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=10) as resp:j=json.load(resp)
              print('SEARCH',module,query,'ROOT',list(j)[:6])
              r=j.get('response',{})
              print('RESPONSE_TYPE',type(r).__name__,'RESPONSE_KEYS',list(r)[:7] if isinstance(r,dict) else '')
              print('SAMPLE',json.dumps(r,ensure_ascii=False)[:1500])
            except Exception as e:print('SEARCH_ERR',module,query,repr(e))
          PY
