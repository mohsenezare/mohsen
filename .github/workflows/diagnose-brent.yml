name: Brent quote source diagnostic
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check only Brent market-data feeds
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, uuid
          UA='Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 Chrome/124.0 Safari/537.36'
          def req(url,body=None):
              headers={'User-Agent':UA,'Accept':'application/json,text/plain,*/*','Referer':'https://tvc-invdn-com.investing.com/'}
              if body is not None: headers['Content-Type']='application/json'
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,headers=headers,data=json.dumps(body).encode() if body is not None else None),timeout=9) as r:
                      print('RESULT',r.status,url[:90],r.read(18000).decode('utf-8','replace')[:7000])
              except Exception as e: print('ERROR',url[:90],repr(e))
          base='https://tvc6.investing.com/'+uuid.uuid4().hex+'/0/0/0/0/'
          req(base+'search?'+urllib.parse.urlencode({'query':'Brent Oil','limit':12,'type':'','exchange':''}))
          req(base+'search?'+urllib.parse.urlencode({'query':'UKOIL','limit':12,'type':'','exchange':''}))
          req(base+'quotes?'+urllib.parse.urlencode({'symbols':'TVC:UKOIL,NYMEX:BZ1!,ICEEUR:BRN1!,OANDA:BCOUSD'}))
          cols=['close','change','change_abs','high','low','update_time']
          for market,tickers in [('cfd',['TVC:UKOIL','TVC:USOIL']),('futures',['NYMEX:BZ1!','ICEEUR:BRN1!'])]:
              req('https://scanner.tradingview.com/'+market+'/scan',{'symbols':{'tickers':tickers},'columns':cols})
          PY
