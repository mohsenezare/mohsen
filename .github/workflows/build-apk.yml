name: Build Mohsen Exact NYMEX Brent + Long-Press Removal APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout dedicated repository
        uses: actions/checkout@v4
      - name: Extract staged Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -q source-base.zip -d project
          find project -name gradlew -type f -print
          test -f project/gradlew
      - name: Apply LIVE Emerald-only patch
        run: |
          cd project
          git apply --check ../LIVE-Emerald.patch
          git apply ../LIVE-Emerald.patch
      - name: Apply TGJU-first pricing, compact display and cache settings
        shell: bash
        run: |
          set -euo pipefail
          base64 -d TGJU-Primary-Compact-Cache.patch.gz.b64 | gzip -dc > TGJU-Primary-Compact-Cache.patch
          patch -d project --dry-run -p1 < TGJU-Primary-Compact-Cache.patch
          patch -d project -p1 < TGJU-Primary-Compact-Cache.patch
          sha256sum project/app/src/main/java/ir/personal/chand/MainActivity.kt project/app/src/main/java/ir/personal/chand/MainViewModel.kt project/app/src/main/java/ir/personal/chand/data/MarketRepository.kt
          test -f project/app/src/main/java/ir/personal/chand/data/CacheMaintenance.kt
          test -f project/app/src/main/java/ir/personal/chand/data/MarketQuotePolicy.kt
      - name: Apply startup speed, catalog update and true compact-card fixes
        shell: bash
        run: |
          set -euo pipefail
          patch -d project --dry-run -p1 < Mohsen-Startup-Catalog-Compact.patch
          patch -d project -p1 < Mohsen-Startup-Catalog-Compact.patch
          echo "Applied source hashes:"
          sha256sum project/app/src/main/java/ir/personal/chand/MainActivity.kt project/app/src/main/java/ir/personal/chand/MainViewModel.kt project/app/src/main/java/ir/personal/chand/data/MarketRepository.kt
          echo "Confirming compact cards and nonblocking first-load changes:"
          grep -nE 'compactColumns|GridCells.Fixed\(compactColumns\)' project/app/src/main/java/ir/personal/chand/MainActivity.kt
          grep -n 'cachedSnapshot' project/app/src/main/java/ir/personal/chand/MainViewModel.kt
          grep -nE 'GLOBAL_TGJU_MODULE_TIMEOUT_MS|IRAN_CATALOG_MAX_REFRESH_MS|GLOBAL_TGJU_MAX_PAGES|TGJU_RESOLVER_RETRY_MS' project/app/src/main/java/ir/personal/chand/data/MarketRepository.kt
      - name: Apply targeted UI, catalog and first-quote fixes
        shell: bash
        run: |
          set -euo pipefail
          patch -d project --dry-run -p1 < Mohsen-Regression-Fixes.patch
          patch -d project -p1 < Mohsen-Regression-Fixes.patch
          echo "Confirming three-mode layout, partial first quotes and resilient TGJU catalog parsing:"
          grep -F 'coerceIn(2, 4)' project/app/src/main/java/ir/personal/chand/MainActivity.kt
          grep -F 'Icons.Default.ViewCompact' project/app/src/main/java/ir/personal/chand/MainActivity.kt
          grep -F 'onPartialSnapshot: ((MarketSnapshot) -> Unit)? = null' project/app/src/main/java/ir/personal/chand/data/MarketRepository.kt
          grep -F 'httpGetTgjuCatalog(url, 8_000)' project/app/src/main/java/ir/personal/chand/data/MarketRepository.kt
          grep -F 'catalogUpdateMutex.withLock' project/app/src/main/java/ir/personal/chand/MainViewModel.kt
      - name: Restore native first-price routes only
        shell: bash
        run: |
          set -euo pipefail
          patch -d project --dry-run -p1 < mohsen-native-price-route-only.patch
          patch -d project -p1 < mohsen-native-price-route-only.patch
          cd project
          echo '5146dd1d524685db1f24a28478d75a084df99b5ed542ca4d7299d47091445b02  app/src/main/java/ir/personal/chand/data/MarketRepository.kt' | sha256sum -c -
          f=app/src/main/java/ir/personal/chand/data/MarketRepository.kt
          grep -F 'tgjuPrimaryValidIds = emptySet()' "$f"
          grep -F 'fetchTgjuItems(tgjuDescriptors, previous, receivedAt)' "$f"
          grep -F 'fetchTsetmcItems(tsetmcDescriptors, previous, receivedAt)' "$f"
          grep -F 'fetchTradingViewItems(tradingViewDescriptors, previous, receivedAt)' "$f"
      - name: Restore first emerald version's complete direct quote paths
        shell: bash
        run: |
          set -euo pipefail
          patch -d project --dry-run -p1 < emerald_original_price_paths_only.patch
          patch -d project -p1 < emerald_original_price_paths_only.patch
          cd project
          echo '10fb21082c0ac2d12d8b644b6d6f61822fa65185f3bba85dc2cccac9cc49808c  app/src/main/java/ir/personal/chand/data/MarketRepository.kt' | sha256sum -c -
          grep -F 'val tgjuDescriptors = descriptors.filter { it.source == MarketSource.TGJU }' app/src/main/java/ir/personal/chand/data/MarketRepository.kt
          grep -F 'val tsetmcDescriptors = descriptors.filter { it.source == MarketSource.TSETMC }' app/src/main/java/ir/personal/chand/data/MarketRepository.kt
          grep -F 'val tradingViewDescriptors = descriptors.filter { it.source == MarketSource.TRADINGVIEW }' app/src/main/java/ir/personal/chand/data/MarketRepository.kt
          grep -F 'onPartialSnapshot?.invoke(partial)' app/src/main/java/ir/personal/chand/data/MarketRepository.kt
          if grep -q 'select<ProviderFetchResult>' app/src/main/java/ir/personal/chand/data/MarketRepository.kt; then
            echo 'Invalid price select loop survived the rollback'; exit 1
          fi
      - name: Add slim horizontal third mode and earlier native price streams
        shell: bash
        run: |
          set -euo pipefail
          patch -d project --dry-run -p1 < Mohsen-Compact-Horizontal-Row-And-First-Stream.patch
          patch -d project -p1 < Mohsen-Compact-Horizontal-Row-And-First-Stream.patch
          cd project
          printf '%s  %s\n' \
            '16db0e9f1b78cfa8e8702c5420bbe2d7ab1e8fa4543e686d08ef4cf8813f82b7' 'app/src/main/java/ir/personal/chand/MainActivity.kt' \
            '59bce09e4d2fb6584a736778ebe124b8329b7515d23e57a7108ca7c98c2f9978' 'app/src/main/java/ir/personal/chand/MainViewModel.kt' | sha256sum -c -
          grep -F 'GridCells.Fixed(if (compactMode) 1' app/src/main/java/ir/personal/chand/MainActivity.kt
          grep -F 'Modifier.height(70.dp)' app/src/main/java/ir/personal/chand/MainActivity.kt
          grep -F 'private fun CompactQuoteRow(' app/src/main/java/ir/personal/chand/MainActivity.kt
          grep -F 'startProviderStreams(includeTsetmc = false)' app/src/main/java/ir/personal/chand/MainViewModel.kt
      - name: Repair catalog updates, verify instrument identity, animate card reorder
        shell: bash
        run: |
          set -euo pipefail
          patch -d project --dry-run -p1 < Mohsen-Catalog-Animation-Symbol-Safety.patch
          patch -d project -p1 < Mohsen-Catalog-Animation-Symbol-Safety.patch
          cd project
          printf '%s  %s\n' \
            '8c5541e0609b9caee6e8830f4a12f694b466cebc41b3379767c5287f2d6e5178' 'app/src/main/java/ir/personal/chand/MainActivity.kt' \
            'b577f0b4376ad3a0c12c88326f86844c47d84ce07bc0741021d48ceebf2b283e' 'app/src/main/java/ir/personal/chand/data/MarketRepository.kt' \
            '245d7178c54615aaf95798e4cc7b149c213638b93f4c92078063570154d45f92' 'app/src/main/java/ir/personal/chand/data/TradingViewStreamClient.kt' \
            'd68decc0513ed725caa5b481c3f0e97ab39f5487a7b9a3b6d2025148d2b380d8' 'app/src/main/java/ir/personal/chand/data/GlobalInstrumentMatch.kt' \
            '59bce09e4d2fb6584a736778ebe124b8329b7515d23e57a7108ca7c98c2f9978' 'app/src/main/java/ir/personal/chand/MainViewModel.kt' | sha256sum -c -
          test -f app/src/test/java/ir/personal/chand/data/GlobalInstrumentMatchTest.kt
          grep -F 'placementSpec = tween(durationMillis = 330' app/src/main/java/ir/personal/chand/MainActivity.kt
          grep -F 'onProgress(4)' app/src/main/java/ir/personal/chand/data/MarketRepository.kt
      - name: Restore previously working quote logic and soften drag reordering
        shell: bash
        run: |
          set -euo pipefail
          patch -d project --dry-run -p1 < Mohsen-Pricing-Rollback-Smoother-Drag.patch
          patch -d project -p1 < Mohsen-Pricing-Rollback-Smoother-Drag.patch
          cd project
          printf '%s  %s\n' \
            'cd44f5ab8c5869a07851acafc0de28f9993e238da4bb5ee22c508005e8aa973c' 'app/src/main/java/ir/personal/chand/MainActivity.kt' \
            'a047cdb15d00f91801c020835cea07f0c9328cca93cdb9017eef1ef726d519b2' 'app/src/main/java/ir/personal/chand/data/MarketRepository.kt' \
            'c2bc6676b4bd790b13d4c60f7401400441e1160a635dff7bf9c10c028d070140' 'app/src/main/java/ir/personal/chand/data/TradingViewStreamClient.kt' \
            '59bce09e4d2fb6584a736778ebe124b8329b7515d23e57a7108ca7c98c2f9978' 'app/src/main/java/ir/personal/chand/MainViewModel.kt' | sha256sum -c -
          test ! -e app/src/main/java/ir/personal/chand/data/GlobalInstrumentMatch.kt
          test ! -e app/src/test/java/ir/personal/chand/data/GlobalInstrumentMatchTest.kt
          grep -F 'placementSpec = spring(dampingRatio = 0.86f' app/src/main/java/ir/personal/chand/MainActivity.kt
          grep -F 'onProgress(4)' app/src/main/java/ir/personal/chand/data/MarketRepository.kt
      - name: Apply exact Brent reference and safe long-press card editing
        shell: bash
        run: |
          set -euo pipefail
          base64 -d Mohsen-Brent-Exact-Contract-LongPress-Edit.patch.gz.b64 | gzip -dc > Mohsen-Brent-Exact-Contract-LongPress-Edit.patch
          echo 'a19d8f5e55128a8009f9f90388723c9cfcaed3ee7fdbc349ad1aec1037f6abe1  Mohsen-Brent-Exact-Contract-LongPress-Edit.patch' | sha256sum -c -
          cd project
          printf '%s  %s\n' \
            'cd44f5ab8c5869a07851acafc0de28f9993e238da4bb5ee22c508005e8aa973c' 'app/src/main/java/ir/personal/chand/MainActivity.kt' \
            'a047cdb15d00f91801c020835cea07f0c9328cca93cdb9017eef1ef726d519b2' 'app/src/main/java/ir/personal/chand/data/MarketRepository.kt' \
            'dc8b52f2d674b6120455bbbfaf2b61216c2b3106d10e96944d6ab87e54b52dd6' 'app/src/main/java/ir/personal/chand/data/MarketModels.kt' \
            'c2bc6676b4bd790b13d4c60f7401400441e1160a635dff7bf9c10c028d070140' 'app/src/main/java/ir/personal/chand/data/TradingViewStreamClient.kt' | sha256sum -c -
          patch --dry-run -p1 < ../Mohsen-Brent-Exact-Contract-LongPress-Edit.patch
          patch -p1 < ../Mohsen-Brent-Exact-Contract-LongPress-Edit.patch
          printf '%s  %s\n' \
            'bb34a0d21f60de7ce61542e8ca2404a754b8d5099489c5f42f6d2ffa0e086aae' 'app/src/main/java/ir/personal/chand/MainActivity.kt' \
            '37452871aa1295ced26fb1172a1c9394a774a237d93a0d2357b5b34b5a6878ca' 'app/src/main/java/ir/personal/chand/data/MarketRepository.kt' \
            '2da25d416c6e0283d803d664990daed58b898eb3de5c74c6c8f6f5effe8437e6' 'app/src/main/java/ir/personal/chand/data/MarketModels.kt' \
            '06527da3056068d912c1e413c1ee0e867c82c85db9d2fb6583cf656297675c7e' 'app/src/main/java/ir/personal/chand/data/TradingViewStreamClient.kt' \
            'f6bd0c89ae00a3cfff2dcb497ce628ec92d4809c9c29a08a9246dfb821487811' 'app/src/main/java/ir/personal/chand/data/QuoteInstrumentIdentity.kt' \
            '31fde6460d6f17fe8594abcd0c66315c37e1d64a6fc528fe267df5f42a9b8cbd' 'app/src/test/java/ir/personal/chand/data/QuoteInstrumentIdentityTest.kt' \
            '59bce09e4d2fb6584a736778ebe124b8329b7515d23e57a7108ca7c98c2f9978' 'app/src/main/java/ir/personal/chand/MainViewModel.kt' | sha256sum -c -
          grep -F 'NYMEX:BZ1!' app/src/main/java/ir/personal/chand/data/QuoteInstrumentIdentity.kt
          grep -F 'selectedForRemoval = item.id' app/src/main/java/ir/personal/chand/MainActivity.kt
      - name: Restore exact approved LIVE session logic
        run: cp overrides/MarketLiveStatus.kt project/app/src/main/java/ir/personal/chand/ui/MarketLiveStatus.kt
      - name: Restore exact approved session LIVE unit tests
        run: cp overrides/MarketLiveStatusTest.kt project/app/src/test/java/ir/personal/chand/ui/MarketLiveStatusTest.kt
      - name: Verify feature source and locked LIVE files
        run: |
          set -euo pipefail
          cd project
          printf '%s  %s\n' \
          'e5aacdc3cc8eb9865ccb33ce9a2608fd8a61a4e276c82a67c2eb5159338701fd' 'app/src/main/java/ir/personal/chand/ui/MarketLiveStatus.kt' \
          '2da25d416c6e0283d803d664990daed58b898eb3de5c74c6c8f6f5effe8437e6' 'app/src/main/java/ir/personal/chand/data/MarketModels.kt' \
          '0219c0b2061cb2fc52eb4b01590661d6fd701b186ab76a8faa836348def597a2' 'app/src/main/java/ir/personal/chand/data/CacheMaintenance.kt' \
          '8b6041973a8fb930193154c6da8e7b18f7fb93b63a60012dbf9da027b766a3f0' 'app/src/main/java/ir/personal/chand/data/MarketQuotePolicy.kt' \
          '8c40912a2c00bc4b2c8a557e7fe252d41300e6e03b93678501bb3940e3f6506d' 'app/build.gradle.kts' \
          'cf4879b4914bb892c8712afab838b712f029de0266b6137e73f54e19100c3f60' 'app/src/test/java/ir/personal/chand/ui/MarketLiveStatusTest.kt' \
          '165f308340bfc8aaabbdb438c6068a7739dc888b531b032ca2eb19d133ac02d4' 'app/src/test/java/ir/personal/chand/data/MarketQuotePolicyTest.kt' | sha256sum -c -
          grep -F 'repository.cachedSnapshot' app/src/main/java/ir/personal/chand/MainViewModel.kt
          grep -F 'if (System.currentTimeMillis() - startedAt >= GLOBAL_TGJU_MODULE_TIMEOUT_MS) break' app/src/main/java/ir/personal/chand/data/MarketRepository.kt
          grep -F 'IRAN_CATALOG_MAX_REFRESH_MS = 100_000L' app/src/main/java/ir/personal/chand/data/MarketRepository.kt
          grep -F 'GLOBAL_TGJU_MAX_PAGES = 20' app/src/main/java/ir/personal/chand/data/MarketRepository.kt
          grep -F 'TGJU_RESOLVER_RETRY_MS = 60_000L' app/src/main/java/ir/personal/chand/data/MarketRepository.kt
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: Build and test debug APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mohsen-nymex-brent-longpress-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload full verified Android source
        uses: actions/upload-artifact@v4
        with:
          name: mohsen-nymex-brent-longpress-source
          path: |
            project/
            !project/.gradle/**
            !project/app/build/**
            !project/build/**
          if-no-files-found: error
