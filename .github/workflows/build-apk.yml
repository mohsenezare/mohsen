name: Build Mohsen First Quote + Catalog + Compact Layout Fixes APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout dedicated repository
        uses: actions/checkout@v4
      - name: Extract staged Android source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project
          unzip -q source-base.zip -d project
          find project -name gradlew -type f -print
          test -f project/gradlew
      - name: Apply LIVE Emerald-only patch
        run: |
          cd project
          git apply --check ../LIVE-Emerald.patch
          git apply ../LIVE-Emerald.patch
      - name: Apply TGJU-first pricing, compact display and cache settings
        shell: bash
        run: |
          set -euo pipefail
          base64 -d TGJU-Primary-Compact-Cache.patch.gz.b64 | gzip -dc > TGJU-Primary-Compact-Cache.patch
          patch -d project --dry-run -p1 < TGJU-Primary-Compact-Cache.patch
          patch -d project -p1 < TGJU-Primary-Compact-Cache.patch
          sha256sum project/app/src/main/java/ir/personal/chand/MainActivity.kt project/app/src/main/java/ir/personal/chand/MainViewModel.kt project/app/src/main/java/ir/personal/chand/data/MarketRepository.kt
          test -f project/app/src/main/java/ir/personal/chand/data/CacheMaintenance.kt
          test -f project/app/src/main/java/ir/personal/chand/data/MarketQuotePolicy.kt
      - name: Apply startup speed, catalog update and true compact-card fixes
        shell: bash
        run: |
          set -euo pipefail
          patch -d project --dry-run -p1 < Mohsen-Startup-Catalog-Compact.patch
          patch -d project -p1 < Mohsen-Startup-Catalog-Compact.patch
          echo "Applied source hashes:"
          sha256sum project/app/src/main/java/ir/personal/chand/MainActivity.kt project/app/src/main/java/ir/personal/chand/MainViewModel.kt project/app/src/main/java/ir/personal/chand/data/MarketRepository.kt
          echo "Confirming compact cards and nonblocking first-load changes:"
          grep -nE 'compactColumns|GridCells.Fixed\(compactColumns\)' project/app/src/main/java/ir/personal/chand/MainActivity.kt
          grep -n 'cachedSnapshot' project/app/src/main/java/ir/personal/chand/MainViewModel.kt
          grep -nE 'GLOBAL_TGJU_MODULE_TIMEOUT_MS|IRAN_CATALOG_MAX_REFRESH_MS|GLOBAL_TGJU_MAX_PAGES|TGJU_RESOLVER_RETRY_MS' project/app/src/main/java/ir/personal/chand/data/MarketRepository.kt
      - name: Apply targeted UI, catalog and first-quote fixes
        shell: bash
        run: |
          set -euo pipefail
          patch -d project --dry-run -p1 < Mohsen-Regression-Fixes.patch
          patch -d project -p1 < Mohsen-Regression-Fixes.patch
          echo "Confirming three-mode layout, partial first quotes and resilient TGJU catalog parsing:"
          grep -F 'coerceIn(2, 4)' project/app/src/main/java/ir/personal/chand/MainActivity.kt
          grep -F 'Icons.Default.ViewCompact' project/app/src/main/java/ir/personal/chand/MainActivity.kt
          grep -F 'onPartialSnapshot: ((MarketSnapshot) -> Unit)? = null' project/app/src/main/java/ir/personal/chand/data/MarketRepository.kt
          grep -F 'httpGetTgjuCatalog(url, 8_000)' project/app/src/main/java/ir/personal/chand/data/MarketRepository.kt
          grep -F 'catalogUpdateMutex.withLock' project/app/src/main/java/ir/personal/chand/MainViewModel.kt
      - name: Restore exact approved LIVE session logic
        run: cp overrides/MarketLiveStatus.kt project/app/src/main/java/ir/personal/chand/ui/MarketLiveStatus.kt
      - name: Restore exact approved session LIVE unit tests
        run: cp overrides/MarketLiveStatusTest.kt project/app/src/test/java/ir/personal/chand/ui/MarketLiveStatusTest.kt
      - name: Verify feature source and locked LIVE files
        run: |
          set -euo pipefail
          cd project
          printf '%s  %s\n' \
          'e5aacdc3cc8eb9865ccb33ce9a2608fd8a61a4e276c82a67c2eb5159338701fd' 'app/src/main/java/ir/personal/chand/ui/MarketLiveStatus.kt' \
          'dc8b52f2d674b6120455bbbfaf2b61216c2b3106d10e96944d6ab87e54b52dd6' 'app/src/main/java/ir/personal/chand/data/MarketModels.kt' \
          '0219c0b2061cb2fc52eb4b01590661d6fd701b186ab76a8faa836348def597a2' 'app/src/main/java/ir/personal/chand/data/CacheMaintenance.kt' \
          '8b6041973a8fb930193154c6da8e7b18f7fb93b63a60012dbf9da027b766a3f0' 'app/src/main/java/ir/personal/chand/data/MarketQuotePolicy.kt' \
          '8c40912a2c00bc4b2c8a557e7fe252d41300e6e03b93678501bb3940e3f6506d' 'app/build.gradle.kts' \
          'cf4879b4914bb892c8712afab838b712f029de0266b6137e73f54e19100c3f60' 'app/src/test/java/ir/personal/chand/ui/MarketLiveStatusTest.kt' \
          '165f308340bfc8aaabbdb438c6068a7739dc888b531b032ca2eb19d133ac02d4' 'app/src/test/java/ir/personal/chand/data/MarketQuotePolicyTest.kt' | sha256sum -c -
          grep -F 'coerceIn(2, 4)' app/src/main/java/ir/personal/chand/MainActivity.kt
          grep -F 'GridCells.Fixed(compactColumns)' app/src/main/java/ir/personal/chand/MainActivity.kt
          grep -F 'repository.cachedSnapshot' app/src/main/java/ir/personal/chand/MainViewModel.kt
          grep -F 'withTimeoutOrNull(GLOBAL_TGJU_MODULE_TIMEOUT_MS)' app/src/main/java/ir/personal/chand/data/MarketRepository.kt
          grep -F 'IRAN_CATALOG_MAX_REFRESH_MS = 100_000L' app/src/main/java/ir/personal/chand/data/MarketRepository.kt
          grep -F 'GLOBAL_TGJU_MAX_PAGES = 20' app/src/main/java/ir/personal/chand/data/MarketRepository.kt
          grep -F 'TGJU_RESOLVER_RETRY_MS = 60_000L' app/src/main/java/ir/personal/chand/data/MarketRepository.kt
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform using runner SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: Build and test debug APK
        working-directory: project
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mohsen-first-quote-catalog-layout-fixes-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
