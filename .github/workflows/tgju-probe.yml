name: Probe TGJU market keys
on:
  push:
    branches: [fix/tgju-source-live-audit]
    paths: [.github/workflows/tgju-probe.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check TGJU grouped quotes and timestamps
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,time
          keys=['ons','silver','oil_brent','crypto-bitcoin','crypto-ethereum','eurusd','gbpusd','usdjpy','eur_usd','gbp_usd','usd_jpy','price_eurusd','price_gbpusd','price_usdjpy','sp500','nasdaq','dxy']
          u='https://api.tgju.org/v1/widget/tmp?keys='+urllib.parse.quote(','.join(keys),safe=',')
          req=urllib.request.Request(u,headers={'User-Agent':'Mozilla/5.0 (Linux; Android 14) Chrome/127 Safari/537.36','Referer':'https://www.tgju.org/','Accept':'application/json'})
          try:
            with urllib.request.urlopen(req,timeout=18) as f:
              body=f.read();j=json.loads(body)
              items=((j.get('response') or {}).get('indicators') or [])
              print('HTTP',f.status,'BYTES',len(body))
              for item in items:
                print('TGJU_KEY',repr(item.get('name')),'PRICE',repr(item.get('p')),'TIME',repr(item.get('updated_at')),'CHG',repr(item.get('dp')))
              print('MISSING',sorted(set(keys)-set(x.get('name') for x in items)))
          except Exception as ex:
            print('PROBE_ERROR',repr(ex))
          PY
